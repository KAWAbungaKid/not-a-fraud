name: workout-ci
on:
  push:
    branches: [main]
    paths: ['workout/**', 'workout-core/**', '.github/workflows/workout-ci.yml', 'gradle/**', 'settings.gradle.kts']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: workout-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GRADLE_VERSION: "9.8.2"
jobs:
  workout-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Workout core unit tests
        run: |
          set -o pipefail
          gradle :workout-core:test --console=plain --stacktrace 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: workout-core, file: build.log }

  workout-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Build workout debug APK
        run: |
          set -o pipefail
          gradle :workout:assembleDebug :workout:assembleDebugAndroidTest --console=plain 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: workout-android, file: build.log }

  workout-emulator:
    needs: workout-android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run workout instrumented tests
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 >/dev/null
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          {
            yes | sdkmanager --licenses >/dev/null
            sdkmanager --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" 2>&1 | grep -v '^\[' | tail -3
            echo no | avdmanager create avd -n ci -p "$ANDROID_AVD_HOME/ci.avd" -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
            echo "disk.dataPartition.size=2048M" >> "$ANDROID_AVD_HOME/ci.avd/config.ini"
          } > emu.log 2>&1
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -partition-size 2048 -gpu swiftshader_indirect -camera-back none -accel on > boot.log 2>&1 &
          timeout 300 adb wait-for-device || echo "== device never appeared" >> emu.log
          booted=0
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && booted=1 && break
            sleep 5
          done
          echo "== booted=$booted after $((i*5))s" >> emu.log
          [ $booted = 1 ] || { tail -40 boot.log >> emu.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          gradle :workout:connectedDebugAndroidTest --console=plain >> emu.log 2>&1
          st=$?
          mkdir -p shots && adb pull /sdcard/Android/data/com.maven.workout.dev/files/shots shots >> emu.log 2>&1
          adb logcat -d AndroidRuntime:E TestRunner:I '*:S' >> emu.log
          exit $st
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: workout-emulator, file: emu.log }
      - name: Push screenshots to ci-logs/workout-shots
        if: always()
        run: |
          set +e
          [ -d shots ] || exit 0
          cd shots; find . -name '*.png' | head
          git init -q -b main; git config user.name ci; git config user.email ci@localhost
          git add -A; git commit -qm "shots ${{ github.sha }}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs/workout-shots

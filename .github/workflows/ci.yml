name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'workout/**', 'workout-core/**', '.github/workflows/workout-*.yml', 'diet/**', 'diet-core/**', '.github/workflows/diet-*.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GRADLE_VERSION: "9.8.2"
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Core unit tests
        run: gradle :core:test --console=plain --stacktrace 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: core, file: build.log }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Build debug APK and run unit tests
        run: gradle :android:assembleDebug :android:testDebugUnitTest --console=plain 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: android, file: build.log }
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/build/outputs/apk/debug/*.apk

  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Build and test desktop app
        shell: bash
        run: gradle :desktop:test :desktop:packageDistributionForCurrentOS --console=plain 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: desktop, file: build.log }

  emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo 'no /dev/kvm'
      - name: Boot emulator and run instrumented tests
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          df -h "$HOME" | tail -1 > emu-df.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 >/dev/null
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          {
            echo "== kvm"; ls -l /dev/kvm
            yes | sdkmanager --licenses >/dev/null
            sdkmanager --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" 2>&1 | grep -v '^\[' | tail -3
            echo no | avdmanager create avd -n ci -p "$ANDROID_AVD_HOME/ci.avd" -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
            echo "disk.dataPartition.size=2048M" >> "$ANDROID_AVD_HOME/ci.avd/config.ini"
            echo "== disk"; cat emu-df.txt
            echo "== avds"; emulator -list-avds
            echo "== emulator version"; emulator -version | head -1
          } > emu.log 2>&1
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -partition-size 2048 -gpu swiftshader_indirect -camera-back none -accel on > boot.log 2>&1 &
          timeout 300 adb wait-for-device || echo "== device never appeared" >> emu.log
          booted=0
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && booted=1 && break
            sleep 5
          done
          echo "== booted=$booted after $((i*5))s" >> emu.log
          echo "== boot.log tail" >> emu.log; tail -40 boot.log >> emu.log
          [ $booted = 1 ] || exit 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          gradle :android:connectedDebugAndroidTest --console=plain >> emu.log 2>&1
          st=$?
          adb logcat -d AndroidRuntime:E TestRunner:I '*:S' >> emu.log
          exit $st
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: emulator, file: emu.log }

name: probe-versions
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest versions of key artifacts
        run: |
          g() { curl -s "https://dl.google.com/android/maven2/$1/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n ${3:-8} | tr '\n' ' '; echo " <- $2"; }
          c() { curl -s "https://repo1.maven.org/maven2/$1/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n ${3:-10} | tr '\n' ' '; echo " <- $2"; }
          p() { curl -s "https://plugins.gradle.org/m2/$1/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n ${3:-10} | tr '\n' ' '; echo " <- $2"; }
          g com/android/tools/build/gradle AGP 15
          g androidx/compose/compose-bom compose-bom
          g androidx/activity/activity-compose activity-compose
          g androidx/core/core-ktx core-ktx
          g androidx/lifecycle/lifecycle-runtime-compose lifecycle
          g androidx/work/work-runtime-ktx work
          g androidx/health/connect/connect-client health-connect 12
          g androidx/compose/material/material-icons-extended icons-ext
          c org/jetbrains/kotlin/kotlin-stdlib kotlin 20
          c org/jetbrains/kotlinx/kotlinx-serialization-json serialization
          c org/jetbrains/kotlinx/kotlinx-coroutines-core coroutines
          c net/java/dev/jna/jna-platform jna
          c org/jetbrains/compose/compose-gradle-plugin compose-mp 15
          p org/jetbrains/compose/org.jetbrains.compose.gradle.plugin compose-mp-plugin 15
          curl -s https://services.gradle.org/versions/all | python3 -c "import json,sys;print([v['version'] for v in json.load(sys.stdin) if not v['snapshot'] and not v['nightly'] and 'rc' not in v['version'] and 'milestone' not in v['version']][:8], '<- gradle')"

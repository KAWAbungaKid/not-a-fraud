name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GRADLE_VERSION: "9.8.2"
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Core unit tests
        run: gradle :core:test --console=plain --stacktrace 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: core, file: build.log }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Build debug APK and run unit tests
        run: gradle :android:assembleDebug :android:testDebugUnitTest --console=plain 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: android, file: build.log }
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/build/outputs/apk/debug/*.apk

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Build and test desktop app
        shell: bash
        run: gradle :desktop:test :desktop:packageDistributionForCurrentOS --console=plain 2>&1 | tee build.log
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: desktop, file: build.log }

  emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo 'no /dev/kvm'
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: bash -c 'set -o pipefail; gradle :android:connectedDebugAndroidTest --console=plain 2>&1 | tee emu.log; st=$?; adb logcat -d AndroidRuntime:E TestRunner:I *:S >> emu.log; exit $st'
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: emulator, file: emu.log }

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
env:
  GRADLE_VERSION: "9.8.2"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - run: gradle :android:assembleRelease --console=plain 2>&1 | tee build.log
      - run: |
          v=$(grep appVersionName gradle.properties | cut -d= -f2)
          cp android/build/outputs/apk/release/android-release.apk not-a-fraud-$v.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "not-a-fraud-*.apk", retention-days: 1 }
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: release-apk, file: build.log }

  msi:
    runs-on: windows-latest
    # The Windows build has hung on the runner before; it must never hold up the phone APK.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - run: gradle :desktop:packageReleaseMsi --console=plain 2>&1 | tee build.log
      - run: |
          v=$(grep appVersionName gradle.properties | cut -d= -f2)
          cp desktop/build/compose/binaries/main-release/msi/*.msi not-a-fraud-windows-$v.msi
      - uses: actions/upload-artifact@v4
        with: { name: msi, path: "not-a-fraud-windows-*.msi", retention-days: 1 }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep appVersionName gradle.properties | cut -d= -f2)
          for i in $(seq 1 30); do gh release view "v$v" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "v$v" not-a-fraud-windows-*.msi --clobber || true
      - if: always()
        uses: ./.github/actions/push-log
        with: { name: release-msi, file: build.log }

  # The phone APK publishes as soon as it's built; the Windows MSI (slow, has hung) adds itself to the release later.
  publish:
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep appVersionName gradle.properties | cut -d= -f2)
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" == v* ]] || tag="v$v"
          notes="docs/releases/$tag.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$tag" dist/* --title "Not a Fraud $v" --notes-file "$notes" || gh release upload "$tag" dist/* --clobber
      - name: Mirror binaries to a git branch (readable from the Claude sandbox)
        run: |
          cd dist
          git init -q -b main
          git config user.name ci; git config user.email ci@localhost
          git add -A; git commit -qm "binaries ${GITHUB_REF_NAME}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs/dist
